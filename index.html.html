<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dance Rush">
<title>🥤 Dr Pepper Dance Rush</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;touch-action:none;user-select:none}
body{min-height:100dvh}
#game{position:relative;width:100%;height:100dvh;overflow:hidden;background:radial-gradient(circle at 18% 18%,#78000d 0 4%,transparent 25%),radial-gradient(circle at 84% 30%,#42006b 0 4%,transparent 25%),linear-gradient(180deg,#191919,#050505)}
#game:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 28px,rgba(255,255,255,.025) 29px 30px)}
#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:0;width:100%;display:flex;justify-content:space-around;z-index:30;padding:4px 8px;font-weight:900;text-shadow:0 2px 5px #000}
.stat{text-align:center;font-size:12px;min-width:75px}.stat b{display:block;font-size:25px;margin-top:1px}
#title{position:absolute;top:55px;left:0;width:100%;z-index:20;text-align:center;font-size:20px;font-weight:900;text-shadow:0 2px 8px #000}
#stage{position:absolute;left:0;right:0;top:92px;bottom:160px;overflow:hidden}
#can{position:absolute;width:92px;height:178px;left:50%;top:52%;transform:translate(-50%,-50%);border:4px solid #ddd;border-radius:22px;background:linear-gradient(90deg,#420006,#b00015 31%,#70000c 59%,#c40018 83%,#450006);box-shadow:0 20px 45px #000;z-index:10;transition:left .12s,top .14s}
#can:before{content:"";position:absolute;left:3px;top:-13px;width:78px;height:21px;border:3px solid #bbb;border-radius:50%;background:linear-gradient(#ddd,#888)}
#can:after{content:"";position:absolute;left:25px;top:5px;width:40px;height:5px;border-radius:50%;background:#666}
.logo{position:absolute;top:55px;left:1px;width:82px;text-align:center;font:bold 21px Georgia,serif;color:#fff;transform:rotate(-8deg);text-shadow:0 2px 3px #300}
.bubble{position:absolute;top:103px;left:0;width:100%;text-align:center;font-size:26px}
.arm{position:absolute;width:53px;height:11px;background:#fff;border-radius:10px;top:76px;z-index:-1}.a1{right:91%;transform:rotate(35deg);animation:a1 .35s infinite alternate}.a2{left:91%;transform:rotate(-35deg);animation:a2 .35s infinite alternate}
@keyframes a1{to{transform:rotate(-45deg)}}@keyframes a2{to{transform:rotate(45deg)}}
.foot{position:absolute;width:38px;height:18px;background:#fff;border-radius:50%;bottom:-27px}.f1{left:5px;animation:f1 .35s infinite alternate}.f2{right:5px;animation:f2 .35s infinite alternate}
@keyframes f1{to{transform:translateY(-16px) rotate(25deg)}}@keyframes f2{to{transform:translateY(-16px) rotate(-25deg)}}
.dancing{animation:bodydance .25s ease-in-out 2}@keyframes bodydance{0%{rotate:-8deg;translate:0 5px}50%{rotate:8deg;translate:0 -14px}100%{rotate:-5deg;translate:0 3px}}
#prompt{position:absolute;left:0;right:0;bottom:112px;text-align:center;font-size:17px;font-weight:900;z-index:25;text-shadow:0 2px 5px #000}
#controls{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 10px}
button{appearance:none;border:2px solid #fff;border-radius:17px;background:#80000f;color:#fff;font-weight:900;font-size:15px;min-height:66px;padding:8px 4px;box-shadow:0 6px 15px #000;touch-action:manipulation}button:active{transform:scale(.93);background:#c0001b}
#message{position:absolute;top:43%;left:0;width:100%;text-align:center;font-size:30px;font-weight:1000;z-index:40;pointer-events:none;text-shadow:0 3px 10px #000;opacity:0}.pop{animation:pop .55s forwards}@keyframes pop{0%{opacity:0;scale:.5}30%{opacity:1;scale:1.15}100%{opacity:0;scale:1}}
.target{position:absolute;width:56px;height:56px;border:4px solid #fff;border-radius:50%;z-index:6;box-shadow:0 0 18px #fff;animation:pulse .55s infinite alternate;display:flex;align-items:center;justify-content:center;font-size:25px}.target:after{content:""}@keyframes pulse{to{transform:scale(1.18);opacity:.55}}
.note{position:absolute;font-size:27px;z-index:35;pointer-events:none;animation:float .85s forwards}@keyframes float{to{transform:translateY(-150px) rotate(360deg);opacity:0}}
#start{position:absolute;inset:0;background:rgba(5,5,5,.95);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
#start h1{font-size:38px;line-height:1.05;margin:0 0 12px;text-shadow:0 4px 12px #000}.small{opacity:.85;max-width:340px;line-height:1.5;font-size:16px}
#startBtn{margin-top:24px;font-size:20px;min-height:64px;padding:15px 28px}
#installTip{margin-top:18px;max-width:330px;font-size:13px;line-height:1.45;opacity:.65}
#flash{position:absolute;inset:0;z-index:4;pointer-events:none;background:#fff;opacity:0}#flash.on{animation:flash .18s}@keyframes flash{0%{opacity:.35}100%{opacity:0}}
@media (min-width:700px){#game{max-width:520px;margin:auto;border-left:1px solid #333;border-right:1px solid #333}}
</style>
</head>
<body>
<div id="game">
  <div id="hud"><div class="stat">SCORE<b id="score">0</b></div><div class="stat">COMBO<b id="combo">0</b></div><div class="stat">TIME<b id="time">30</b></div></div>
  <div id="title">🥤 Dr Pepper Dance Floor 🥤</div>
  <div id="stage"><div id="can"><div class="arm a1"></div><div class="arm a2"></div><div class="logo">Dr Pepper</div><div class="bubble">♨</div><div class="foot f1"></div><div class="foot f2"></div></div></div>
  <div id="message"></div><div id="prompt">Tap START to dance!</div><div id="flash"></div>
  <div id="controls"><button data-move="left">⬅️<br>SLIDE</button><button data-move="jump">⬆️<br>JUMP</button><button data-move="spin">🔄<br>SPIN</button><button data-move="right">➡️<br>SLIDE</button></div>
  <div id="start"><h1>🥤 DR PEPPER<br>DANCE RUSH</h1><div class="small">Match the move shown on screen. Build your combo and make the can dance!</div><button id="startBtn">START DANCING!</button><div id="installTip">Tip: once this is hosted on a web page, use Safari's Share menu → <b>Add to Home Screen</b> to make it feel like an iPhone game.</div></div>
</div>
<script>
const can=document.getElementById('can'),stage=document.getElementById('stage'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),timeEl=document.getElementById('time'),msg=document.getElementById('message'),promptEl=document.getElementById('prompt'),flash=document.getElementById('flash');
let score=0,combo=0,time=30,running=false,current=null,timer=null,jumpTimer=null;
const moves=['left','jump','spin','right'];
const labels={left:'⬅️ SLIDE LEFT',right:'➡️ SLIDE RIGHT',jump:'⬆️ JUMP',spin:'🔄 SPIN'};
const icons={left:'⬅️',right:'➡️',jump:'⬆️',spin:'🔄'};
function spawnTarget(){document.querySelectorAll('.target').forEach(x=>x.remove());current=moves[Math.floor(Math.random()*moves.length)];const t=document.createElement('div');t.className='target';t.dataset.move=current;t.textContent=icons[current];t.style.left=(12+Math.random()*76)+'%';t.style.top=(12+Math.random()*70)+'%';stage.appendChild(t);promptEl.textContent=labels[current]}
function note(){const n=document.createElement('div');n.className='note';n.textContent=['♪','♫','♬','★','🥤'][Math.floor(Math.random()*5)];n.style.left=(25+Math.random()*50)+'%';n.style.top=(40+Math.random()*35)+'%';stage.appendChild(n);setTimeout(()=>n.remove(),900)}
function pop(text){msg.textContent=text;msg.className='';void msg.offsetWidth;msg.className='pop'}
function doMove(move){if(!running)return;can.classList.remove('dancing');void can.offsetWidth;can.classList.add('dancing');if(move==='left')can.style.left='30%';if(move==='right')can.style.left='70%';if(move==='jump'){clearTimeout(jumpTimer);can.style.top='28%';jumpTimer=setTimeout(()=>can.style.top='52%',220)}if(move==='spin'){can.animate([{transform:'translate(-50%,-50%) rotate(0deg)'},{transform:'translate(-50%,-50%) rotate(360deg)'}],{duration:430,easing:'ease-out'})}if(move===current){combo++;score+=100+combo*20;pop(combo>=5?'🔥 AMAZING!':'NICE! 🔥');note();flash.className='on';setTimeout(()=>flash.className='',200);spawnTarget()}else{combo=0;pop('MISS! 😵');spawnTarget()}scoreEl.textContent=score;comboEl.textContent=combo}
function startGame(){document.getElementById('start').style.display='none';score=0;combo=0;time=30;running=true;scoreEl.textContent=0;comboEl.textContent=0;timeEl.textContent=30;can.style.left='50%';can.style.top='52%';spawnTarget();clearInterval(timer);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000)}
function endGame(){running=false;clearInterval(timer);clearTimeout(jumpTimer);document.querySelectorAll('.target').forEach(x=>x.remove());promptEl.textContent='Round complete!';document.querySelector('#start h1').innerHTML='🥤 DANCE OVER!<br>SCORE: '+score;document.querySelector('#start .small').textContent='Final combo: '+combo+'. Tap below to play another 30-second round!';document.getElementById('startBtn').textContent='PLAY AGAIN!';document.getElementById('start').style.display='flex'}
document.querySelectorAll('#controls button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();doMove(b.dataset.move)}));
document.getElementById('startBtn').addEventListener('pointerdown',e=>{e.preventDefault();startGame()});
</script>
</body>
</html>
